databases:
  - name: spendwise-db
    plan: free
    databaseName: spendwise
    user: spendwise_user

services:
  - type: web
    name: spendwise-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ExpTrack/login
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: spendwise-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: spendwise-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: spendwise-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: spendwise-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: spendwise-db
          property: password
      - key: PORT
        value: "8080"
